name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Daily commits may only touch public/content/
        run: |
          msg=$(git log -1 --pretty=%s)
          if [[ "$msg" == daily:* ]] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            outside=$(git diff --name-only HEAD~1 HEAD | grep -v '^public/content/' || true)
            if [ -n "$outside" ]; then
              echo "::error::A daily: commit changed files outside public/content/:"; echo "$outside"; exit 1
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
